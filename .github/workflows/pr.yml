name: pr
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-ead/ubuntu-builder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - name: Run task pr
        run: |
          clang-format --version
          clang-tidy --version
          task pr
