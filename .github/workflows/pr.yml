name: pr
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-22 gcc-16 g++-16 llvm-22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100
          sudo update-alternatives --set clang /usr/bin/clang-22
          sudo update-alternatives --set gcc /usr/bin/gcc-16
          sudo update-alternatives --set g++ /usr/bin/g++-16
      - name: Install clang-format and clang-tidy
        run: |
          BINDIR="$HOME/.local/bin/ccpp-lint"
          mkdir -p "$BINDIR"
          BASE_URL="https://github.com/cpp-linter/clang-tools-static-binaries/releases/latest/download"
          curl -fsSL "$BASE_URL/clang-format-22_linux-amd64" -o "$BINDIR/clang-format"
          curl -fsSL "$BASE_URL/clang-tidy-22_linux-amd64" -o "$BINDIR/clang-tidy"
          chmod +x "$BINDIR/clang-format" "$BINDIR/clang-tidy"
          echo "$HOME/.local/bin/ccpp-lint" >> "$GITHUB_PATH"
      - uses: go-task/setup-task@v2
      - name: Run task pr
        run: |
          clang-format --version
          clang-tidy --version
          task pr
