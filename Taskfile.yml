version: '3'

vars:
  SOURCES: src include/nn

tasks:
  configure:
    desc: Configure CMake
    cmds:
      - cmake -G Ninja -B build -S . -DNN_SDK=1.2.3 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
  build:
    desc: Check the project builds
    cmds:
      - cmake --build build --target all_verify_header_sets

  check:
    desc: Run clang-format and clang-tidy checks
    cmds:
      - task: clang-format
        vars: { ARGS: -n -Werror }
      - task: clang-tidy
  fix:
    desc: Run clang-format to format the code
    cmds:
      - task: clang-format
        vars: { ARGS: -i }

  clang-format:
    cmds:
      - > 
        find {{.SOURCES}}
        -regextype posix-extended
        -regex '.*\.[ch](\+\+|pp|xx|c|h)?'
        | xargs -P {{numCPU}} -n 1
        clang-format {{.ARGS}}
  clang-tidy:
    cmds:
      - >
        find {{.SOURCES}}
        -regextype posix-extended
        -regex '.*\.[ch](\+\+|pp|xx|c|h)?'
        | xargs -P {{numCPU}} -n 1
        clang-tidy --warnings-as-errors='*' --header-filter='include/nn'
        -p build
        --quiet
