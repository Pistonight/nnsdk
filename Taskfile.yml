version: '3'

# https://taskfile.dev

vars:
  SOURCES: src include/nn include/nvn include/nvnTool

tasks:
  pr:
    desc: Run everything the PR checks
    cmds:
      - task: configure
      - task: build
      - task: check

  configure:
    desc: Configure CMake
    cmds:
      - task: update-sources
      - cmake -G Ninja -B build -S . -DNN_SDK=1.2.3 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
  build:
    desc: Check the project builds
    cmds:
      - cmake --build build --target all_verify_header_sets

  check:
    desc: Run clang-format and clang-tidy checks
    cmds:
      - task: clang-format
        vars: { ARGS: -n -Werror }
      - task: clang-tidy
  fix:
    desc: Run clang-format to format the code
    cmds:
      - task: clang-format
        vars: { ARGS: -i }

  update-sources:
    desc: Update sources in CMakeLists.txt
    cmds:
      - silent: true
        cmd: |
          echo '# SOURCES_START' > out
          echo '' >> out
          LC_ALL=C find include/nn -type f | sort >> out
          echo '' >> out
          echo '# SOURCES_END' >> out
          sed -i -e 's/^include/    include/' out
          sed -i -e '/# SOURCES_START/r out' -e '/# SOURCES_START/,/# SOURCES_END/d' CMakeLists.txt
          echo 'CMakeLists.txt updated'

          echo '# SOURCES_START' > out
          echo '' >> out
          LC_ALL=C find include/nvn include/nvnTool -type f | sort >> out
          echo '' >> out
          echo '# SOURCES_END' >> out
          sed -i -e 's/^include/    ${NINTENDOSDK_PATH}\/include/' out
          sed -i -e '/# SOURCES_START/r out' -e '/# SOURCES_START/,/# SOURCES_END/d' src/nvn/CMakeLists.txt
          echo 'src/nvn/CMakeLists.txt updated'

          rm out
          
  clean:
    desc: Remove CMake build files
    cmds:
      - rm -rf build

  clang-format:
    cmds:
      - > 
        find {{.SOURCES}}
        -regextype posix-extended
        -regex '.*\.[ch](\+\+|pp|xx|c|h)?'
        | xargs -P {{numCPU}} -n 1
        clang-format {{.ARGS}}
  clang-tidy:
    cmds:
      - >
        find {{.SOURCES}}
        -regextype posix-extended
        -regex '.*\.[ch](\+\+|pp|xx|c|h)?'
        | xargs -P {{numCPU}} -n 1
        clang-tidy --warnings-as-errors='*' --header-filter='include/(nn|nvn|nvnTool|nv)'
        -p build
        --quiet
